[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creature-world"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "openai>=1.30",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
